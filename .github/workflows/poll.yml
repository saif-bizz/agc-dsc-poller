name: DSC Poller

# Polls Gallabox for unassigned WhatsApp threads and drafts a reply via
# claude-code-action. Replaces the prior local /loop runner and the prior
# Cloudflare worker.
#
# Concurrency rule: only one poller run at a time across the whole repo. If
# a previous run is still going when the cron fires, the new run is queued
# (NOT cancelled) so we don't lose ticks. Job-level timeout of 4 minutes
# keeps any single run from blocking the next */5 boundary.

on:
  schedule:
    # Every 5 minutes. Adjust to */10 if free-tier minutes become a concern.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      dry_run_override:
        description: 'Override DRY_RUN for this manual run (true/false). Leave blank to use the repo secret.'
        required: false
        default: ''

concurrency:
  group: dsc-poller
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write     # required by claude-code-action

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # --- Gallabox ---
      GALLABOX_API_KEY: ${{ secrets.GALLABOX_API_KEY }}
      GALLABOX_API_SECRET: ${{ secrets.GALLABOX_API_SECRET }}
      GALLABOX_ACCOUNT_ID: ${{ secrets.GALLABOX_ACCOUNT_ID }}
      GALLABOX_CHANNEL_ID: ${{ secrets.GALLABOX_CHANNEL_ID }}
      GALLABOX_API_BASE: https://server.gallabox.com/devapi

      # --- Shopify ---
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
      SHOPIFY_API_VERSION: '2025-01'

      # --- Telegram ---
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}

      # --- Cloudflare KV (audit log) ---
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}

      # --- Floor-team escalation user (Gallabox userId) ---
      ESCALATION_USER_ID: ${{ secrets.ESCALATION_USER_ID }}

      # --- Sales-lead feedback channel ---
      # Comma-separated E.164 numbers whose messages are treated as
      # AUTHORITATIVE feedback (auto-promoted into live rules) instead of
      # being drafted as customer replies. See src/feedback.py.
      FEEDBACK_PHONES: ${{ secrets.FEEDBACK_PHONES }}

      # --- Media proxy (Phase 2: floor-team photo relay) ---
      # Base URL of the agc-dsc-media-proxy Cloudflare Worker, e.g.
      # https://agc-dsc-media-proxy.agc-ops.workers.dev. The HMAC secret
      # MUST match the one set on the worker via wrangler secret put.
      MEDIA_PROXY_BASE_URL: ${{ secrets.MEDIA_PROXY_BASE_URL }}
      MEDIA_HMAC_SECRET: ${{ secrets.MEDIA_HMAC_SECRET }}

      # --- Runtime flags ---
      # Repo secret default. workflow_dispatch input below can override per-run.
      DRY_RUN: ${{ github.event.inputs.dry_run_override != '' && github.event.inputs.dry_run_override || secrets.DRY_RUN }}
      MAX_THREADS_PER_TICK: ${{ secrets.MAX_THREADS_PER_TICK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show runtime config (no secrets)
        run: |
          echo "DRY_RUN=$DRY_RUN"
          echo "MAX_THREADS_PER_TICK=$MAX_THREADS_PER_TICK"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Cron: '${{ github.event.schedule }}'"

      - name: KV audit heartbeat (loud, non-fatal)
        # Direct curl PUT of tick-heartbeat:<run_id> against the same CF KV
        # REST path src/audit.py uses. A broken CF_API_TOKEN /
        # CF_KV_NAMESPACE_ID / CF_ACCOUNT_ID secret shows up as a grepable
        # [KV_HEARTBEAT] FAIL in every run log instead of failing silently
        # inside audit.py. Never fails the job.
        continue-on-error: true
        run: |
          KEY="tick-heartbeat:${{ github.run_id }}"
          HTTP=$(curl -s -o /tmp/hb.json -w "%{http_code}" -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/${KEY}?expiration_ttl=604800" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"run_id\":\"${{ github.run_id }}\",\"ts\":\"$(date -u +%FT%TZ)\",\"event\":\"${{ github.event_name }}\"}")
          if [ "$HTTP" = "200" ] && grep -q '"success": *true' /tmp/hb.json; then
            echo "[KV_HEARTBEAT] PASS key=$KEY"
          else
            echo "[KV_HEARTBEAT] FAIL http=$HTTP body=$(head -c 300 /tmp/hb.json)"
            echo "[AUDIT_WRITE_FAILED] kv heartbeat write failed - check CF_API_TOKEN / CF_KV_NAMESPACE_ID / CF_ACCOUNT_ID repo secrets"
          fi

      - name: Run Sara (claude-code-action)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Tools: Bash + file IO only. No MCP. All third-party access is
          # routed through the helper scripts in src/.
          # Hard cap on Claude turns per run — backstop on the per-run timeout.
          claude_args: '--allowed-tools Bash,Read,Grep,Glob,Write,Edit --max-turns 180'
          prompt: |
            You are Sara, a courteous WhatsApp sales agent for an
            e-commerce store. This is a single, independent poll run
            triggered by GitHub Actions cron — there is no /loop, no
            continuation. When this run ends, the runner is destroyed.

            ────────────────────────────────────────────────
            PRIMARY INSTRUCTION SOURCES (read these first, in order)
            ────────────────────────────────────────────────
            1. prompt/sara-system.md   (your persona + conversation rules)
            2. prompt/brand-snippet.md (customer-facing facts: hours,
               shipping policy, payment, returns)
            3. prompt/run-prompt.md    (per-tick workflow you must execute)

            Re-read these every run — do not assume they have not changed.

            Then execute the workflow described in prompt/run-prompt.md
            exactly. Stop after the [TICK_SUMMARY] line.
