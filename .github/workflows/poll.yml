name: DSC Poller

# Polls Gallabox for unassigned WhatsApp threads and drafts a reply via
# claude-code-action. Replaces the prior local /loop runner and the prior
# Cloudflare worker.
#
# Concurrency rule: only one poller run at a time across the whole repo. If
# a previous run is still going when the cron fires, the new run is queued
# (NOT cancelled) so we don't lose ticks. Job-level timeout of 4 minutes
# keeps any single run from blocking the next */5 boundary.

on:
  schedule:
    # FALLBACK ONLY (hourly). The primary trigger is the agc-dsc-cron-relay
    # Cloudflare Worker (MARKETING/scripts/agc-dsc-cron-relay) dispatching
    # workflow_dispatch every 5 min — GitHub throttled the old */15 schedule
    # to ~10 runs/day. This hourly cron is a safety net if the relay dies.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      dry_run_override:
        description: 'Override DRY_RUN for this manual run (true/false). Leave blank to use the repo secret.'
        required: false
        default: ''

concurrency:
  group: dsc-poller
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write     # required by claude-code-action

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # --- Gallabox ---
      GALLABOX_API_KEY: ${{ secrets.GALLABOX_API_KEY }}
      GALLABOX_API_SECRET: ${{ secrets.GALLABOX_API_SECRET }}
      GALLABOX_ACCOUNT_ID: ${{ secrets.GALLABOX_ACCOUNT_ID }}
      GALLABOX_CHANNEL_ID: ${{ secrets.GALLABOX_CHANNEL_ID }}
      GALLABOX_API_BASE: https://server.gallabox.com/devapi

      # --- Shopify ---
      SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
      SHOPIFY_ADMIN_TOKEN: ${{ secrets.SHOPIFY_ADMIN_TOKEN }}
      SHOPIFY_API_VERSION: '2025-01'

      # --- Telegram ---
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}

      # --- Cloudflare KV (audit log) ---
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}

      # --- Floor-team escalation user (Gallabox userId) ---
      ESCALATION_USER_ID: ${{ secrets.ESCALATION_USER_ID }}

      # --- AOV ceiling for auto-close (AED) ---
      # Orders at/over this total are NOT auto-drafted with a checkout link;
      # shopify.py draft_order_create suppresses the link + flags escalation
      # (fail-closed: if this is unset, NO draft can be created at all).
      ESCALATION_AOV_THRESHOLD: ${{ secrets.ESCALATION_AOV_THRESHOLD }}

      # --- Sales-lead feedback channel ---
      # Comma-separated E.164 numbers whose messages are treated as
      # AUTHORITATIVE feedback (auto-promoted into live rules) instead of
      # being drafted as customer replies. See src/feedback.py.
      FEEDBACK_PHONES: ${{ secrets.FEEDBACK_PHONES }}

      # --- Media proxy (Phase 2: floor-team photo relay) ---
      # Base URL of the agc-dsc-media-proxy Cloudflare Worker, e.g.
      # https://agc-dsc-media-proxy.agc-ops.workers.dev. The HMAC secret
      # MUST match the one set on the worker via wrangler secret put.
      MEDIA_PROXY_BASE_URL: ${{ secrets.MEDIA_PROXY_BASE_URL }}
      MEDIA_HMAC_SECRET: ${{ secrets.MEDIA_HMAC_SECRET }}

      # --- Runtime flags ---
      # Repo secret default. workflow_dispatch input below can override per-run.
      DRY_RUN: ${{ github.event.inputs.dry_run_override != '' && github.event.inputs.dry_run_override || secrets.DRY_RUN }}
      MAX_THREADS_PER_TICK: ${{ secrets.MAX_THREADS_PER_TICK }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Show runtime config (no secrets)
        run: |
          echo "DRY_RUN=$DRY_RUN"
          echo "MAX_THREADS_PER_TICK=$MAX_THREADS_PER_TICK"
          echo "Triggered by: ${{ github.event_name }}"
          echo "Cron: '${{ github.event.schedule }}'"

      - name: KV audit heartbeat (loud, non-fatal, at most hourly)
        # Canary PUT against the same CF KV REST path src/audit.py uses. A
        # broken CF_API_TOKEN / CF_KV_NAMESPACE_ID / CF_ACCOUNT_ID secret shows
        # up as a grepable [KV_HEARTBEAT] FAIL in the run log instead of failing
        # silently inside audit.py. Never fails the job.
        #
        # WRITE-AMPLIFICATION FIX (26-06-2026): the key was tick-heartbeat:<run_id>
        # (unique per run) so the */5 relay burned 288 KV writes/day on heartbeats
        # alone, against the FREE-tier 1,000 writes/day cap. The key is now bucketed
        # to the hour and only written when that hour's bucket is absent: at most 24
        # writes/day while still catching a broken-secret regression within the hour.
        continue-on-error: true
        run: |
          KEY="tick-heartbeat:$(date -u +%FT%H)"
          # Read-guard: skip the write if this hour's heartbeat already exists
          # (reads are not the capped operation; writes are).
          EXISTS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/${KEY}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}")
          if [ "$EXISTS" = "200" ]; then
            echo "[KV_HEARTBEAT] SKIP (hour bucket already written) key=$KEY"
          else
            HTTP=$(curl -s -o /tmp/hb.json -w "%{http_code}" -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/${KEY}?expiration_ttl=604800" \
              -H "Authorization: Bearer ${CF_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"run_id\":\"${{ github.run_id }}\",\"ts\":\"$(date -u +%FT%TZ)\",\"event\":\"${{ github.event_name }}\"}")
            if [ "$HTTP" = "200" ] && grep -q '"success": *true' /tmp/hb.json; then
              echo "[KV_HEARTBEAT] PASS key=$KEY"
            else
              echo "[KV_HEARTBEAT] FAIL http=$HTTP body=$(head -c 300 /tmp/hb.json)"
              echo "[AUDIT_WRITE_FAILED] kv heartbeat write failed - check CF_API_TOKEN / CF_KV_NAMESPACE_ID / CF_ACCOUNT_ID repo secrets"
            fi
          fi

      - name: Run Sara (claude-code-action)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Tools: Bash + file IO only. No MCP. All third-party access is
          # routed through the helper scripts in src/.
          # Hard cap on Claude turns per run — backstop on the per-run timeout.
          claude_args: '--allowed-tools Bash,Read,Grep,Glob,Write,Edit --max-turns 180'
          prompt: |
            You are Sara, a courteous WhatsApp sales agent for an
            e-commerce store. This is a single, independent poll run
            triggered by GitHub Actions cron — there is no /loop, no
            continuation. When this run ends, the runner is destroyed.

            ────────────────────────────────────────────────
            PRIMARY INSTRUCTION SOURCES (read these first, in order)
            ────────────────────────────────────────────────
            1. prompt/sara-system.md   (your persona + conversation rules)
            2. prompt/brand-snippet.md (customer-facing facts: hours,
               shipping policy, payment, returns)
            3. prompt/run-prompt.md    (per-tick workflow you must execute)

            Re-read these every run — do not assume they have not changed.

            Then execute the workflow described in prompt/run-prompt.md
            exactly. Stop after the [TICK_SUMMARY] line.

      - name: Telegram alert on failure (at most one per hour)
        # 02-08-2026 -> 06-08-2026 the poller failed every tick for four days
        # (claude-code-action returned is_error with 0 cost / 1 turn) and the
        # only signal was ~4,200 unread GitHub notifications. Alert where it
        # gets read instead. Hour-bucketed through the same KV namespace as the
        # heartbeat above so a sustained outage costs 24 messages/day, not 288.
        # ponytail: KV bucket is the rate limiter; swap for a real alert
        # manager only if this ever needs escalation policies.
        if: failure()
        continue-on-error: true
        run: |
          KEY="fail-alert:$(date -u +%FT%H)"
          KV="https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/${KEY}"
          EXISTS=$(curl -s -o /dev/null -w "%{http_code}" "$KV" -H "Authorization: Bearer ${CF_API_TOKEN}")
          if [ "$EXISTS" = "200" ]; then
            echo "[FAIL_ALERT] SKIP (already alerted this hour)"
            exit 0
          fi
          curl -s -o /dev/null -X PUT "${KV}?expiration_ttl=86400" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" --data '1'
          curl -s -o /dev/null -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=DSC Poller tick FAILED. No customer replies are going out. https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "[FAIL_ALERT] SENT"
